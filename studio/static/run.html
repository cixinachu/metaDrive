<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验运行 · MetaDrive Studio</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f5f7fa}header{position:sticky;top:0;z-index:2}main{display:block;max-width:1500px;padding:24px}article{padding:20px;background:transparent}.runGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.runCard{background:#fff;border:1px solid var(--border);border-radius:9px;padding:20px;margin-bottom:18px}.runStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.runStats>div{background:#f8fafc;border:1px solid var(--border);padding:14px;border-radius:7px}.runStats small{color:var(--muted)}.runStats strong{display:block;font-size:19px;margin-top:7px}.runActions{display:flex;gap:8px;flex-wrap:wrap}.runActions a{border:1px solid var(--border);background:#fff;padding:8px 11px;border-radius:6px;text-decoration:none;font-size:12px}.runActions a[hidden]{display:none}.videoList{display:flex;gap:8px;flex-wrap:wrap}.videoList a{padding:8px 11px;background:#eff6ff;border-radius:6px;text-decoration:none}.runChart{width:100%;height:220px}.runLog{max-height:260px;overflow:auto;white-space:pre-wrap;font-size:11px;color:#4b5563}.runTop{display:flex;justify-content:space-between;align-items:center}.pill.running{color:#92400e;background:#fffbeb}.pill.completed{color:#166534;background:#f0fdf4}.pill.failed{color:#991b1b;background:#fef2f2}@media(max-width:900px){.runGrid{grid-template-columns:1fr}.runStats{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="brand"><span class="mark">M</span><div><b>MetaDrive <em>实验运行</em></b><small id="runJob">正在连接任务…</small></div></div><span id="runState" class="pill">连接中</span><button id="stopRun" disabled>停止并保存</button></header><main><article><div class="runTop"><div><p class="eyebrow">RUN MONITOR</p><h1 id="runTitle">实验运行状态</h1></div><a href="/">返回场景设置</a></div><div class="runCard"><div class="runStats"><div><small>进度</small><strong id="runProgress">—</strong><progress id="runBar" max="1" value="0"></progress></div><div><small>已完成回合 / epoch</small><strong id="runEpisodes">—</strong></div><div><small>设备</small><strong id="runDevice">—</strong></div><div><small>场景 / seed</small><strong id="runScene">—</strong></div><div><small>实际速度</small><strong id="runSpeed">测量中…</strong></div><div><small>状态</small><strong id="runMessage">等待任务启动</strong></div></div><p id="runError" class="help"></p></div><div class="runGrid"><section class="runCard"><h2>训练 / 评估曲线</h2><div id="runCharts" class="placeholder">正在等待指标…</div></section><section class="runCard"><h2>实验文件下载</h2><div class="runActions" id="runDownloads"></div><h2 style="margin-top:22px">评估视频</h2><p class="help">评估回合结束后，视频会保存在任务 results/<任务编号>/videos/ 中。</p><div id="runVideos" class="videoList">评估视频生成后显示在这里。</div></section></div><section class="runCard"><h2>运行日志</h2><pre id="runLog" class="runLog">等待任务启动…</pre></section></article></main><script src="/run.js"></script></body></html>
